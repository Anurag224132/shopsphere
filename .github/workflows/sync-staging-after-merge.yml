# This workflow automatically syncs the staging branch with main after every PR merge.
# Workflow: feature/* → staging (test) → main (production)
# After merging staging → main, this action resets staging to match main exactly,
# so the next feature branch always starts from a clean, up-to-date base.

name: Sync staging with main after merge

on:
  push:
    branches:
      - main

jobs:
  sync-staging:
    name: Reset staging to match main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Reset staging to main
        run: |
          git checkout staging
          git reset --hard origin/main
          git push origin staging --force
